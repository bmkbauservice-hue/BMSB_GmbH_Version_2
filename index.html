<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="BMSB Bau- und Industrieservice GmbH in Berlin – Bauleistungen, Industrieservice, Instandhaltung und professionelle Lösungen aus einer Hand." />
    <meta name="theme-color" content="#0ea5e9" />
    <script>
      try {
        const savedTheme = localStorage.getItem("bmsb-theme");
        const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        const useDarkTheme = savedTheme ? savedTheme === "dark" : prefersDark;

        document.documentElement.classList.toggle("dark", useDarkTheme);
        document.documentElement.style.colorScheme = useDarkTheme ? "dark" : "light";
        document
          .querySelector('meta[name="theme-color"]')
          ?.setAttribute("content", useDarkTheme ? "#07111d" : "#0ea5e9");
      } catch {
        document.documentElement.classList.remove("dark");
      }
    </script>
    <link rel="icon" type="image/png" href="%BASE_URL%images/brand/bmsb-logo.png" />
    <title>BMSB Bau- und Industrieservice GmbH</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
